name: SalesTrackr CI and Deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy.yml'
      - '.dockerignore'
      - 'Dockerfile'
      - 'requirements.txt'
      - 'pyproject.toml'
      - 'backend/**'
      - 'frontend/**'
      - 'scripts/**'
      - 'producttrackr.production.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: salestrackr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          install_components: cloud-firestore-emulator
      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check -r requirements.txt
          .venv/bin/python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Start isolated Firestore emulator
        run: |
          gcloud emulators firestore start --host-port=127.0.0.1:8085 \
            --project=demo-salestrackr-ci --quiet > "$RUNNER_TEMP/firestore-emulator.log" 2>&1 &
          echo "FIRESTORE_EMULATOR_HOST=127.0.0.1:8085" >> "$GITHUB_ENV"
          .venv/bin/python - <<'PY'
          import time
          import urllib.request
          for attempt in range(60):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8085/", timeout=2) as response:
                      assert response.status == 200
                  break
              except OSError:
                  time.sleep(1)
          else:
              raise SystemExit("The Firestore emulator did not become ready.")
          PY
      - name: Check backend
        run: |
          .venv/bin/python -m ruff check backend scripts
          .venv/bin/python -m pytest -q
      - name: Install UI dependencies and browser
        run: |
          npm --prefix frontend ci
          npm --prefix frontend exec -- playwright install --with-deps chromium
      - name: Build and check UI
        run: npm --prefix frontend test
      - name: Check real Firestore backup and recovery UI
        working-directory: frontend
        run: npx playwright test --config playwright.firestore.config.ts --reporter=line
      - name: Check ProductTrackr directory, files and backup UI
        working-directory: frontend
        run: npx playwright test --config playwright.manufacturing.config.ts --reporter=line

  deploy:
    name: Deploy production
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
      ARTIFACT_REGISTRY_REPOSITORY: ${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build production image
        id: image
        run: |
          image="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REGISTRY_REPOSITORY}/${CLOUD_RUN_SERVICE}:${GITHUB_SHA}"
          docker build --tag "$image" .
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - name: Authenticate to Google Cloud without a key
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
      - name: Push image
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
          docker push "$IMAGE"
      - name: Update the existing private service
        id: deploy
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          PRODUCTTRACKR_ADMIN_EMAILS: ${{ vars.PRODUCTTRACKR_ADMIN_EMAILS }}
        run: |
          gcloud run services describe "$CLOUD_RUN_SERVICE" --region="$GCP_REGION" --format=json > "$RUNNER_TEMP/service-before.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from scripts.producttrackr_deploy import production_environment
          service = json.loads((Path(os.environ["RUNNER_TEMP"]) / "service-before.json").read_text())
          assert service["metadata"]["annotations"].get("run.googleapis.com/iap-enabled") == "true", "IAP must be enabled before deployment."
          expected = production_environment(os.environ["GCP_PROJECT_ID"], service, os.environ.get("PRODUCTTRACKR_ADMIN_EMAILS", ""))
          folder = Path(os.environ["RUNNER_TEMP"])
          (folder / "producttrackr-expected.json").write_text(json.dumps(expected))
          values = {key: item["value"] for key, item in expected.items() if "value" in item}
          (folder / "producttrackr-env.txt").write_text("^|^" + "|".join(f"{key}={value}" for key, value in values.items()))
          PY
          digest="$(gcloud artifacts docker images describe "$IMAGE" --format='value(image_summary.digest)')"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          gcloud run services update "$CLOUD_RUN_SERVICE" \
            --region="$GCP_REGION" \
            --image="${IMAGE%:*}@${digest}" \
            --update-env-vars="$(cat "$RUNNER_TEMP/producttrackr-env.txt")" \
            --remove-env-vars=PRODUCTTRACKR_BACKUP_DRIVE_FOLDER_ID \
            --remove-secrets=PRODUCTTRACKR_DRIVE_TOKEN_JSON \
            --min=0 --max=1 --min-instances=0 --max-instances=1 \
            --quiet
          gcloud run services describe "$CLOUD_RUN_SERVICE" --region="$GCP_REGION" --format=json > "$RUNNER_TEMP/service-after.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          folder = Path(os.environ["RUNNER_TEMP"])
          before = json.loads((folder / "service-before.json").read_text())
          after = json.loads((folder / "service-after.json").read_text())
          old_spec = before["spec"]["template"]["spec"]
          new_spec = after["spec"]["template"]["spec"]
          old_env = {item["name"]: item for item in old_spec["containers"][0]["env"]}
          new_env = {item["name"]: item for item in new_spec["containers"][0]["env"]}
          expected = json.loads((folder / "producttrackr-expected.json").read_text())
          removed = {"PRODUCTTRACKR_BACKUP_DRIVE_FOLDER_ID", "PRODUCTTRACKR_DRIVE_TOKEN_JSON"}
          assert {key: item for key, item in old_env.items() if key not in expected and key not in removed} == {key: item for key, item in new_env.items() if key not in expected and key not in removed}, "SalesTrackr runtime settings or secret references changed."
          assert not removed.intersection(new_env), "Legacy ProductTrackr Drive configuration remains."
          assert all(new_env.get(key) == item for key, item in expected.items()), "ProductTrackr runtime settings do not match."
          assert old_spec["serviceAccountName"] == new_spec["serviceAccountName"], "Runtime identity changed."
          assert after["metadata"]["annotations"].get("run.googleapis.com/iap-enabled") == "true", "IAP is not enabled."
          assert after["metadata"]["annotations"].get("run.googleapis.com/maxScale") == "1", "Service instance limit changed."
          scaling = after["spec"]["template"]["metadata"]["annotations"]
          assert scaling.get("autoscaling.knative.dev/maxScale") == "1", "Revision instance limit changed."
          assert scaling.get("autoscaling.knative.dev/minScale", "0") == "0", "Scale-to-zero is not enabled."
          status = after["status"]
          assert any(item["type"] == "Ready" and item["status"] == "True" for item in status["conditions"]), "Service is not ready."
          assert status["latestReadyRevisionName"] == status["latestCreatedRevisionName"], "New revision is not ready."
          assert any(item.get("percent") == 100 and item.get("revisionName") == status["latestReadyRevisionName"] for item in status["traffic"]), "Traffic is not on the new revision."
          url = new_env["PUBLIC_ORIGIN"]["value"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"url={url}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as output:
              output.write(f"### SalesTrackr and ProductTrackr deployed\n\n[Open SalesTrackr]({url}) | [Open ProductTrackr]({url}/manufacturing)\n\nCommit: `{os.environ['GITHUB_SHA']}`\n\nBoth Trackrs share Settings, combined recovery, and SalesTrackr's Drive root and authorization. Their database workspaces remain distinct. SalesTrackr's secret references, runtime identity and IAP protection were retained; the legacy ProductTrackr secret reference was removed, not revoked.\n")
          PY
      - name: Confirm anonymous access is blocked
        env:
          APP_URL: ${{ steps.deploy.outputs.url }}
        run: |
          status="$(curl --silent --show-error --max-time 60 --output /dev/null --write-out '%{http_code}' "$APP_URL")"
          case "$status" in
            302|303|401|403) ;;
            *) echo "Unexpected anonymous response: $status"; exit 1 ;;
          esac
